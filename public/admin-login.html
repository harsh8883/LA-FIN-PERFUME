<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LA FIN | Secure Administrator Authentication</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
    <style>
        .login-gateway-page {
            min-height: 100vh;
            background: radial-gradient(circle at 50% 25%, #1d1d19 0%, #0c0c0b 80%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .gateway-card {
            background: #151513;
            border: 1px solid rgba(198, 165, 107, 0.4);
            border-radius: 16px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(198, 165, 107, 0.08);
            overflow: hidden;
            animation: cardFadeIn 0.3s ease-out;
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .gateway-header {
            padding: 36px 32px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            background: #11110f;
        }

        .gateway-icon {
            font-size: 34px;
            width: 68px;
            height: 68px;
            margin: 0 auto 16px;
            background: rgba(198, 165, 107, 0.12);
            border: 1px solid var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gateway-title {
            font-family: "Playfair Display", serif;
            font-size: 26px;
            letter-spacing: 5px;
            color: var(--gold);
            margin-bottom: 6px;
        }

        .gateway-badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--gold);
            background: rgba(198, 165, 107, 0.15);
            padding: 3px 10px;
            border-radius: 4px;
            border: 1px solid var(--gold);
            text-transform: uppercase;
        }

        .gateway-desc {
            font-size: 13px;
            color: var(--muted);
            margin-top: 10px;
        }

        .gateway-body {
            padding: 32px;
        }

        .alert-box {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            line-height: 1.5;
        }

        .alert-box.error {
            display: block;
            background: rgba(231, 76, 60, 0.15);
            border: 1px solid #e74c3c;
            color: #ff8b80;
        }

        .alert-box.success {
            display: block;
            background: rgba(39, 174, 96, 0.15);
            border: 1px solid #27ae60;
            color: #4ade80;
        }

        .gateway-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--cream);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-input-wrap input {
            width: 100%;
            background: #0f0f0e;
            border: 1px solid var(--border-color);
            color: var(--cream);
            padding: 13px 16px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        .form-input-wrap input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px var(--gold-glow);
        }

        .btn-toggle-pwd {
            position: absolute;
            right: 14px;
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 15px;
        }

        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: var(--muted);
        }

        .remember-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .remember-wrap input {
            accent-color: var(--gold);
            cursor: pointer;
        }

        .btn-login-submit {
            background: linear-gradient(135deg, #d3b47e, #b89355);
            color: #11110f;
            font-weight: 700;
            font-size: 14px;
            padding: 14px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.5px;
            margin-top: 6px;
        }

        .btn-login-submit:hover {
            background: linear-gradient(135deg, #dfc28d, #c6a56b);
            box-shadow: 0 4px 20px rgba(198, 165, 107, 0.35);
            transform: translateY(-1px);
        }

        .demo-helper-box {
            background: rgba(198, 165, 107, 0.06);
            border: 1px dashed rgba(198, 165, 107, 0.3);
            border-radius: 8px;
            padding: 12px 14px;
            margin-top: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: var(--muted);
        }

        .btn-quick-fill {
            background: transparent;
            border: 1px solid var(--border-gold);
            color: var(--gold);
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-quick-fill:hover {
            background: var(--gold);
            color: #11110f;
        }

        .gateway-footer {
            padding: 18px 32px;
            background: #11110f;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
        }

        .gateway-footer a {
            color: var(--gold);
            text-decoration: none;
            transition: color 0.2s;
        }

        .gateway-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body class="login-gateway-page">

    <div class="gateway-card">
        <div class="gateway-header">
            <div class="gateway-icon">👑</div>
            <h1 class="gateway-title">LA FIN<span>™</span></h1>
            <span class="gateway-badge">Admin Security Gateway</span>
            <p class="gateway-desc">Strictly restricted to authorized store administrators. Normal customers cannot access this area.</p>
        </div>

        <div class="gateway-body">
            <!-- Alert Banner -->
            <div id="authAlert" class="alert-box"></div>

            <form id="adminLoginForm" class="gateway-form">
                <div class="form-group">
                    <label class="form-label" for="adminEmail">Administrator Email</label>
                    <div class="form-input-wrap">
                        <input type="email" id="adminEmail" required placeholder="admin@lafin.luxury" autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="adminPassword">Master Password</label>
                    <div class="form-input-wrap">
                        <input type="password" id="adminPassword" required placeholder="Enter admin password" autocomplete="current-password">
                        <button type="button" class="btn-toggle-pwd" id="togglePasswordBtn" title="Toggle visibility">👁️</button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-wrap">
                        <input type="checkbox" id="rememberSession" checked>
                        <span>Remember this admin session</span>
                    </label>
                </div>

                <button type="submit" class="btn-login-submit" id="btnSubmitLogin">
                    <span>🛡️ Authenticate &amp; Access Dashboard</span>
                </button>
            </form>

            <div class="demo-helper-box">
                <div>
                    <span>Official Admin ID:</span><br>
                    <strong style="color: var(--cream); font-size: 11px;">admin@lafin.luxury</strong>
                    <div style="font-size: 10px; color: var(--muted); margin-top: 2px;">Local Demo Password: <code style="color: var(--gold);">admin123</code></div>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button type="button" class="btn-quick-fill" id="btnQuickFillAdmin">
                        ✨ Fill Credentials
                    </button>
                    <button type="button" class="btn-quick-fill" id="btnInstantAdminLogin" style="background: var(--gold); color: #111; font-weight: 700;">
                        ⚡ Instant Access
                    </button>
                </div>
            </div>
        </div>

        <div class="gateway-footer">
            <span style="color: var(--muted-dark);">LA FIN Security Engine v2.4</span>
            <a href="Homepage.html">← Return to Public Store</a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="store.js"></script>
    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('adminLoginForm');
            const emailInput = document.getElementById('adminEmail');
            const passwordInput = document.getElementById('adminPassword');
            const rememberCheckbox = document.getElementById('rememberSession');
            const alertBox = document.getElementById('authAlert');
            const togglePasswordBtn = document.getElementById('togglePasswordBtn');
            const btnQuickFillAdmin = document.getElementById('btnQuickFillAdmin');
            const btnInstantAdminLogin = document.getElementById('btnInstantAdminLogin');
            const btnSubmitLogin = document.getElementById('btnSubmitLogin');

            // If already authenticated, redirect immediately to dashboard
            if (typeof AdminAuth !== 'undefined' && AdminAuth.isAuthenticated()) {
                window.location.replace('admin.html');
                return;
            }

            // Check if redirected because unauthorized
            try {
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.has('unauthorized')) {
                    showAlert('🔒 Administrator access required. Please authenticate below to access the Admin Portal.', 'error');
                }
            } catch (e) {}

            // Quick Fill helper
            btnQuickFillAdmin.addEventListener('click', () => {
                emailInput.value = ADMIN_CONFIG.EMAIL;
                passwordInput.value = 'admin123';
                showAlert('Credentials filled! Click "Authenticate" or "Instant Access" to proceed.', 'success');
            });

            // Instant 1-Click Login
            if (btnInstantAdminLogin) {
                btnInstantAdminLogin.addEventListener('click', () => {
                    emailInput.value = ADMIN_CONFIG.EMAIL;
                    passwordInput.value = 'admin123';
                    const res = AdminAuth.login(ADMIN_CONFIG.EMAIL, 'admin123', true);
                    if (res.success) {
                        showAlert('⚡ Authenticated! Redirecting to Admin Dashboard...', 'success');
                        setTimeout(() => {
                            window.location.replace('admin.html');
                        }, 500);
                    }
                });
            }

            // Toggle password visibility
            togglePasswordBtn.addEventListener('click', () => {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                togglePasswordBtn.textContent = isPassword ? '🙈' : '👁️';
            });

            function showAlert(message, type = 'error') {
                alertBox.textContent = message;
                alertBox.className = `alert-box ${type}`;
            }

            // Handle login submission
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const email = emailInput.value.trim();
                const password = passwordInput.value.trim();
                const remember = rememberCheckbox.checked;

                btnSubmitLogin.disabled = true;
                btnSubmitLogin.innerHTML = '<span>Verifying Security Keys...</span>';

                setTimeout(() => {
                    // Authenticate with AdminAuth module
                    const result = AdminAuth.login(email, password, remember);

                    if (result.success) {
                        showAlert('Authentication successful! Loading secure dashboard...', 'success');
                        setTimeout(() => {
                            window.location.replace('admin.html');
                        }, 700);
                    } else {
                        btnSubmitLogin.disabled = false;
                        btnSubmitLogin.innerHTML = '<span>🛡️ Authenticate &amp; Access Dashboard</span>';
                        showAlert(result.message, 'error');
                    }
                }, 400);
            });
        });
    </script>
</body>
</html>
